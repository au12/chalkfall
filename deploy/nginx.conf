server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

  # hashed bundles never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  # the page and the service worker must always be fresh so updates roll out
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
